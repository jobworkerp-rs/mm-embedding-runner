syntax = "proto3";

package mm_embedding;

// Result for both embed_text and embed_image. One Embedding entry per text
// chunk (embed_text) or per input image (embed_image), in input order.
message MmEmbeddingResult {
  message Embedding {
    // The embedding vector. Always L2-normalized (Euclidean norm ~= 1); the
    // runner has no option to return un-normalized vectors.
    repeated float values = 1;

    // begin_position / end_position / content meaning depends on the method:
    //
    // embed_text:
    //   begin_position / end_position are character offsets (Unicode scalar
    //   value indices, NOT byte offsets) into the original input text,
    //   marking the half-open range [begin_position, end_position) that this
    //   chunk covers. content is exactly that substring.
    //
    // embed_image:
    //   begin_position is the 0-based index of this image in the input
    //   items array; end_position is begin_position + 1. content is the
    //   item's label if set, otherwise its file_path, otherwise the literal
    //   string "image[#i]" where i is the index.
    uint32 begin_position = 2;
    uint32 end_position = 3;
    string content = 4;
  }
  repeated Embedding embeddings = 1;
  optional ModelInfo model_info = 2;
}

message ModelInfo {
  // HuggingFace repository ID of the loaded model.
  string model_name = 1;
  // Length of every values vector in the result.
  uint32 embedding_dimension = 2;
  // Backend-reported dtype or quantization label. Qwen3 reports "F32",
  // "F16", or "BF16"; ONNX reports labels derived from the selected model
  // file such as "ONNX", "INT8", "F16", "Q4", or "BNB4".
  string dtype_used = 3;
  // True only for multimodal models. Text-only backends such as Qwen3 text
  // embedding and ModernBERT ONNX report false.
  bool supports_vision = 4;
  // Always false: audio embedding is not supported.
  bool supports_audio = 5;
  // Always unset: no audio support.
  optional uint32 audio_sample_rate = 6;
}
