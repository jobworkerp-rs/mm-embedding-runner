syntax = "proto3";

package mm_embedding;

// Multimodal embedding runner settings, supplied once when the plugin is
// loaded. Invalid values are rejected at load time with an
// "InvalidArgument:" error.
message MultimodalEmbeddingRunnerSettings {
  // HuggingFace repository ID (e.g. "Qwen/Qwen3-VL-Embedding-2B").
  // Trim-empty values are rejected at load() time.
  string model_id = 1;

  Device device = 2;
  // CUDA device index when device == CUDA. Defaults to 0 when unset.
  optional uint32 gpu_device_index = 3;

  DType dtype = 4;

  // Runner default: 2048. Allowed range: [16, 32768].
  // The Qwen3-VL-Embedding model itself supports up to 32K tokens, but this
  // runner caps at the configured value to keep memory predictable.
  uint32 max_sequence_length = 5;

  // Per-image compressed input size cap (bytes). Defaults to 10 MiB.
  optional uint64 image_size_limit_bytes = 6;

  // Per-image decoded bitmap size cap (bytes), checked before decoding via
  // width*height*4. Unset => 256 MiB cap. Value 0 => unlimited (no cap).
  optional uint64 max_decoded_image_bytes = 7;

  // Whitelist of directories from which file_path image sources are accepted.
  // Empty (the default) means file_path sources are rejected entirely.
  // The runner canonicalizes each entry at load() time and matches inputs by
  // Path::starts_with on the canonical path (component-aware).
  repeated string allowed_image_dirs = 8;

  // Tokenizer model ID for char-offset accounting. Defaults to model_id when unset.
  optional string tokenizer_model_id = 9;

  // Hierarchical text chunking config for embed_text. When unset, defaults
  // are derived from max_sequence_length: max_chunk_tokens =
  // max_sequence_length and min_chunk_tokens = 0.
  optional ChunkingConfig chunking_config = 10;

  // ONNX model file inside the HuggingFace repository for ModernBertModel
  // checkpoints. Defaults to "onnx/model.onnx" when unset or blank.
  optional string onnx_model_file = 11;

  // Pooling strategy used for ModernBertModel ONNX checkpoints. Unset means
  // MEAN, matching common sentence-transformers ModernBERT exports.
  OnnxPooling onnx_pooling = 12;
}

enum Device {
  DEVICE_UNSPECIFIED = 0;
  CPU = 1;
  CUDA = 2;
  METAL = 3;
}

enum DType {
  DTYPE_UNSPECIFIED = 0;
  F32 = 1;
  F16 = 2;
  BF16 = 3;
}

enum OnnxPooling {
  ONNX_POOLING_UNSPECIFIED = 0;
  ONNX_POOLING_MEAN = 1;
  ONNX_POOLING_CLS = 2;
}

// Hierarchical chunking parameters for the embed_text method.
message ChunkingConfig {
  // Upper bound on tokens per chunk. When unset, defaults to
  // max_sequence_length. Must be > 0 and <= max_sequence_length.
  optional uint32 max_chunk_tokens = 1;
  // Lower bound used when merging small adjacent chunks. When unset,
  // defaults to 0. Must be strictly less than max_chunk_tokens.
  optional uint32 min_chunk_tokens = 2;
}
