# Empty [workspace] table makes this crate an isolated workspace root,
# preventing cargo from traversing up to a parent workspace. This keeps the
# fastembed/candle-core dependency tree independent.
[workspace]

[package]
name = "mm-embedding-runner"
version = "0.1.0"
edition = "2024"
authors = ["sutr"]
description = "Multimodal embedding plugin (text + image) backed by fastembed-rs Qwen3-VL-Embedding"
repository = "https://github.com/jobworkerp-rs/llama-plugins"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Git submodules under modules/, referenced by path.
# Run `git submodule update --init --recursive` before building.
jobworkerp-client = { path = "modules/jobworkerp-client" }
command-utils    = { path = "modules/command-utils" }

# Multimodal embedding backend. Pin exactly to ensure API stability against
# the surface verified during planning (Qwen3VLEmbedding::from_hf, embed_texts,
# embed_image_bytes).
#
# default-features=false drops fastembed's default native-tls features
# (hf-hub-native-tls + ort-download-binaries-native-tls). We re-enable the
# rustls equivalents so neither the ONNX Runtime download nor hf-hub links
# the host's libssl. image-models is re-added because the default set
# included it (qwen3 already pulls `image`, but keep it explicit).
fastembed = { version = "=5.13.4", default-features = false, features = [
    "qwen3",
    "image-models",
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
# Match fastembed's pinned candle-core to avoid duplicate compilation; feature
# selection (cuda/metal) propagates from fastembed/* features.
candle-core = "=0.10.2"

# Vendored fork of fastembed 5.13.4. The upstream Qwen3*Embedding::from_hf
# builds its hf-hub Api with ApiBuilder::new(), pinning the cache to
# $HOME/.cache/huggingface/hub and ignoring HF_HOME/HF_ENDPOINT. The fork
# switches to ApiBuilder::from_env() so model weights honor HF_HOME the same
# way our separately-fetched tokenizer.json already does. The fork keeps
# version = "5.13.4" so the "=5.13.4" requirement above still resolves, and
# retains the rustls feature set so the libssl-free distribution constraint
# holds. See modules/fastembed (git submodule).

# Image preflight (header sniff + dimension extraction) for zip-bomb defense
# without invoking the full decoder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# HuggingFace Hub for separately fetching tokenizer.json (Qwen3VLEmbedding
# itself loads its own weights internally). default-features=false drops the
# native-tls default; rustls-tls keeps the resulting .so independent of the
# host's libssl/libcrypto.
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls"] }

# Blocking HTTP client for the url image source. rustls-tls (not native-tls)
# so no libssl linkage; version matches the one hf-hub pulls in to keep the
# dependency graph single-version.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Tokenizer for char/byte offset accounting in chunking.
tokenizers = "0.22"

anyhow       = "1"
async-trait  = "0.1"
prost        = "0.14"
schemars     = { version = "1.0.4", features = ["chrono04"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing      = "0.1"
dotenvy      = "0.15"
once_cell    = "1"

[build-dependencies]
prost-build = "0.14"

[features]
default = []
# CUDA/Metal acceleration is passed through to fastembed which in turn
# propagates to candle-core/candle-nn.
cuda  = ["fastembed/cuda"]
metal = ["fastembed/metal"]

[dev-dependencies]
tempfile = "3"

# Redirect the fastembed 5.13.4 source to the vendored fork submodule. Only
# the source is swapped; the version pin and feature selection on the
# dependency above continue to apply. See the comment near the fastembed
# dependency for rationale.
[patch.crates-io]
fastembed = { path = "modules/fastembed" }
